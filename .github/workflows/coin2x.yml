name: coin2x
on:
  workflow_dispatch:
    inputs:
      nshard:
        description: number of shards
        required: false
        default: '18'
jobs:
  coin2-j1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        shard: [0,1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: pip install --quiet coincurve pycryptodome eth-account
      - name: sweep shard ${{ matrix.shard }}
        run: python3 -u coin2.py
        env:
          SHARD: ${{ matrix.shard }}
          NSHARD: ${{ inputs.nshard }}
name: coin2x
