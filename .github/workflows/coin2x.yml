name: coin2x
on:
  workflow_dispatch:
    inputs:
      nshard:
        description: number of shards
        required: false
        default: '34'
jobs:
  coin2-j1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        shard: [16,17,18,19,20,21,22,23,24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: pip install --quiet coincurve pycryptodome eth-account
      - name: sweep shard ${{ matrix.shard }}
        run: python3 -u coin2.py
        env:
          SHARD: ${{ matrix.shard }}
          NSHARD: ${{ inputs.nshard }}
  coin2-j2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        shard: [25,26,27,28,29,30,31,32,33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: pip install --quiet coincurve pycryptodome eth-account
      - name: sweep shard ${{ matrix.shard }}
        run: python3 -u coin2.py
        env:
          SHARD: ${{ matrix.shard }}
          NSHARD: ${{ inputs.nshard }}
